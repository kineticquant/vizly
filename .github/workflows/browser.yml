name: Browser

# Level 3 visual / browser smoke — release confidence, not a PR gate.
# Hero charts: line, bar, pie, map, mix under theme=default.

on:
  schedule:
    - cron: "0 8 * * 1" # Mondays 08:00 UTC
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  hero-visual:
    name: Playwright hero charts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package + Playwright
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,browser]"
          python -m playwright install --with-deps chromium

      - name: Pytest browser smoke
        run: python -m pytest -m browser -v

      - name: Upload hero HTML
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: vizly-hero-html
          path: artifacts/html/
          if-no-files-found: warn
          retention-days: 14
