[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vizly"
version = "1.0.1"
authors = [{ name = "Kineticquant" }]
description = "High-performance, low-boilerplate, fully-themable Python charting over Apache ECharts (local assets, native web embeds)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Jupyter",
]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "sqlalchemy>=2.0.0",
    "openpyxl>=3.0.0",
]
[project.urls]
Homepage = "https://github.com/kineticquant/vizly"
Changelog = "https://github.com/kineticquant/vizly/blob/main/CHANGELOG.md"
Issues = "https://github.com/kineticquant/vizly/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff>=0.15,<1", "mypy", "build", "twine"]
browser = ["playwright>=1.40"]
streamlit = ["streamlit"]
fastapi = ["fastapi", "uvicorn", "httpx"]
flask = ["flask"]
django = ["django"]
examples = [
    "streamlit",
    "fastapi",
    "uvicorn",
    "httpx",
    "flask",
    "django",
]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vizly*"]

[tool.setuptools.package-data]
vizly = [
    "assets/*.js",
    "assets/*.md",
    "assets/maps/*.json",
    "integrations/vizly_st_component/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "samples: Level 2 sample/golden chart suite (HTML artifacts + option goldens)",
    "browser: Level 3 Playwright visual smoke (hero charts; not a per-commit gate)",
]

[tool.coverage.run]
branch = true
source = ["vizly"]
omit = [
    "*/vizly/assets/*",
    "*/vizly/integrations/django/templatetags/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Core-module gate is applied in CI via --include (theme/data/base/api).
fail_under = 0

[tool.ruff]
src = ["src", "tests", "examples"]
target-version = "py39"

[tool.ruff.lint]
# Pin rules explicitly — Ruff 0.16+ widened defaults and broke unconfigured CI.
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
]
