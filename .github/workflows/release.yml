name: Release

# Publish from GitHub only (no local twine upload required).
#
# Recommended: PyPI / TestPyPI Trusted Publishing (OIDC) — no API tokens.
# Trigger: push a version tag, e.g. git tag v0.2.0 && git push origin v0.2.0
# Or run this workflow manually (workflow_dispatch).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI (Trusted Publishing)
        if: ${{ vars.ENABLE_TESTPYPI_PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Skip notice (TestPyPI)
        if: ${{ vars.ENABLE_TESTPYPI_PUBLISH != 'true' }}
        run: |
          echo "::notice::ENABLE_TESTPYPI_PUBLISH is not true — upload skipped (job still green)."

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Require ENABLE_PYPI_PUBLISH
        if: ${{ vars.ENABLE_PYPI_PUBLISH != 'true' }}
        run: |
          echo "::error::ENABLE_PYPI_PUBLISH is not true. Dist was built but not uploaded to PyPI."
          echo "Set repo variable ENABLE_PYPI_PUBLISH=true, then re-run this workflow on the tag."
          exit 1
      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
