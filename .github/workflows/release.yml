name: Release

# Publish from GitHub only (no local twine upload required).
#
# Recommended: PyPI / TestPyPI Trusted Publishing (OIDC) — no API tokens.
# Trigger: push a version tag, e.g. git tag v0.2.1 && git push origin v0.2.1
# Or run this workflow manually (workflow_dispatch).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  verify:
    name: lint + test (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install package + tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]"
      - name: Ruff
        run: ruff check src/vizly tests
      - name: Pytest Level 1 + Level 2 (exclude browser)
        run: |
          coverage run --source=vizly -m pytest -q -m "not browser"
          coverage report \
            --include='*/vizly/theme/*,*/vizly/data.py,*/vizly/base.py,*/vizly/api.py' \
            --fail-under=70

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist/

  publish-testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Publish to TestPyPI (Trusted Publishing)
        if: ${{ vars.ENABLE_TESTPYPI_PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
      - name: Skip notice (TestPyPI)
        if: ${{ vars.ENABLE_TESTPYPI_PUBLISH != 'true' }}
        run: |
          echo "::notice::ENABLE_TESTPYPI_PUBLISH is not true — upload skipped (job still green)."

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Require ENABLE_PYPI_PUBLISH
        if: ${{ vars.ENABLE_PYPI_PUBLISH != 'true' }}
        run: |
          echo "::error::ENABLE_PYPI_PUBLISH is not true. Dist was built but not uploaded to PyPI."
          echo "Set repo variable ENABLE_PYPI_PUBLISH=true, then re-run this workflow on the tag."
          exit 1
      - name: Publish to PyPI (Trusted Publishing)
        if: ${{ vars.ENABLE_PYPI_PUBLISH == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub Release
    needs: [build, publish-pypi]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/
      - name: Extract changelog section
        run: |
          python <<'PY'
          from pathlib import Path
          import os

          tag = os.environ["GITHUB_REF_NAME"]
          ver = tag[1:] if tag.startswith("v") else tag
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          header = f"## [{ver}]"
          start = text.find(header)
          if start < 0:
              body = f"Release {tag}. See CHANGELOG.md for details.\n"
          else:
              rest = text[start + len(header) :]
              # Skip optional date suffix on the header line
              nl = rest.find("\n")
              rest = rest[nl + 1 :] if nl >= 0 else rest
              end = rest.find("\n## [")
              section = rest if end < 0 else rest[:end]
              body = f"## {tag}\n\n{section.strip()}\n"
          Path("release_notes.md").write_text(body, encoding="utf-8")
          print(body)
          PY
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release_notes.md
          fail_on_unmatched_files: true
