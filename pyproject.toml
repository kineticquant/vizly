[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vizly"
version = "0.1.0"
authors = [
    { name="Your Name", email="your.email@example.com" }
]
description = "An aesthetics-first, zero-config interactive plotting wrapper over ECharts"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: Jupyter",
 ]
dependencies = [
    "pandas>=1.5.0",
    "numpy>=1.22.0",
    "pyecharts>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["vizly*"]