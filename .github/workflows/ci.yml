name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-build:
    name: lint + test + build (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Documented targets: 3.9–3.13 (requires-python >=3.9)
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,examples]"

      - name: Ruff
        run: ruff check src/vizly tests

      - name: Pytest Level 1 + Level 2 (exclude browser)
        run: |
          # Use coverage CLI (more reliable than pytest-cov on some Python builds)
          # Level 2 samples write artifacts/html (gitignored) and check goldens/options
          coverage run --source=vizly -m pytest -q -m "not browser"
          coverage report \
            --include='*/vizly/theme/*,*/vizly/data.py,*/vizly/base.py,*/vizly/api.py' \
            --fail-under=70

      - name: Upload sample HTML artifacts
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: vizly-sample-html
          path: artifacts/html/
          if-no-files-found: warn
          retention-days: 14

      - name: Build sdist + wheel
        if: matrix.python-version == '3.12'
        run: |
          python -m build
          twine check dist/*
